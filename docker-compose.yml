version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrovision-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://astrovision.io}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - AI_MODEL_GENERATION=${AI_MODEL_GENERATION:-gemma4}
      - AI_MODEL_VALIDATION=${AI_MODEL_VALIDATION:-qwen3.5}
      - DATABASE_URL=postgresql://astro_user:astro_password@postgres:5432/astrovision_db
    depends_on:
      - postgres
      - ollama

  postgres:
    image: postgres:15-alpine
    container_name: astrovision-postgres
    restart: always
    environment:
      - POSTGRES_USER=astro_user
      - POSTGRES_PASSWORD=astro_password
      - POSTGRES_DB=astrovision_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: astrovision-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  astrovision-data:
  postgres-data:
  ollama-data:
