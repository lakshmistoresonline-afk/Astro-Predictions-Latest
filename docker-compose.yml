version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrovision-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://astrovision.io
      - ADMIN_API_KEY=astrovision_admin_secret_key_2026
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - AI_MODEL_GENERATION=gemma4
      - AI_MODEL_VALIDATION=qwen3.5
      - DATABASE_URL=sqlite:////app/data/astrovision.db
    volumes:
      - astrovision-data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: astrovision-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  astrovision-data:
  ollama-data:
