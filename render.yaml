services:
  - type: web
    name: astrovision-api
    env: python
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://astrovision.io,http://localhost:3000
      - key: ADMIN_API_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
